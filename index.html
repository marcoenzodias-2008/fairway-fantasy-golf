.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:22px 0 10px;border-bottom:3px double var(--ink)}
.word{font:700 32px/1 'Libre Caslon Text',Georgia,serif;letter-spacing:-.01em}
.tag{font:italic 15px 'Libre Caslon Text',Georgia,serif;color:var(--mute)}
.banner{display:block;width:100%;height:100px;border-bottom:1px solid var(--ink)}
.dateline{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 0;font-size:14px;color:var(--mute);border-bottom:1px solid var(--line)}
.dateline b{color:var(--ink)}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:0 0 6px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:13px 0 10px;font:inherit;font-weight:700;color:var(--mute);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{border:1px solid var(--btn);background:var(--btn);color:var(--btni);font:inherit;font-weight:700;padding:10px 18px;border-radius:2px;cursor:pointer}
.btn.alt{background:none;color:var(--ink)}
.btn.sm{padding:5px 12px;font-size:14px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
label{display:block;font-size:13px;color:var(--mute);margin:14px 0 2px}
input,select{width:100%;font:inherit;padding:8px 0;border:0;border-bottom:1.5px solid var(--ink);background:none;color:var(--ink);border-radius:0}
select option{color:#111}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:8px}
@media(max-width:640px){.cols{grid-template-columns:1fr;gap:6px}}
.mute{color:var(--mute);font-size:14px}
.err{color:var(--acc);min-height:22px;margin-top:10px;font-size:14px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;font-weight:500;color:var(--mute);text-align:right;padding:8px 8px 6px;border-bottom:1px solid var(--ink)}
.tbl td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0}
.tbl td:last-child,.tbl th:last-child{padding-right:0}
.tbl td.l,.tbl th.l{text-align:left}
.tbl tr.me td{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.scroll{overflow-x:auto}
.u{color:var(--acc);font-weight:700}
.dim{opacity:.4}
.board{background:var(--board);color:var(--bi);border:2px solid var(--ink);padding:2px 14px 6px;margin:12px 0}
.board .tbl th{color:#b8c9b6;border-color:#f3ebd355}
.board .tbl td{border-color:#f3ebd326;font-family:'Libre Caslon Text',Georgia,serif;font-size:16px}
.board .u{color:#ff9f89}
.board .mute{color:#b8c9b6}
.board .tbl tr.me td{background:#ffffff14}
.salary{font:700 34px/1 'Libre Caslon Text',Georgia,serif}
.bar{height:4px;background:var(--line);margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--ink)}.bar.over i{background:var(--acc)}
.slot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.slot.open{color:var(--mute);font-style:italic}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute);margin:12px 0 0}
.chk input{width:auto}
.note{padding:10px 0 10px 14px;border-left:3px solid var(--acc);margin:14px 0;font-size:14.5px}
.sp{height:6px}
details summary{cursor:pointer;font-weight:700;margin-top:12px}
.news p{margin:0 0 12px}

/* ---------- scoring ---------- */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const memo={};
function sim(p,seed,r){
  const k=seed+"-"+p+"-"+r;if(memo[k])return memo[k];
  const R=rng(seed*7+p*7919+r*104729),s=(PL[p].skill-45)/55;let pts=0,to=0;
  for(let h=0;h<18;h++){const x=R(),pe=.006+.03*s,pb=.1+.24*s,pbo=.24-.13*s,pd=.055-.035*s;
    if(x<pe){pts+=8;to-=2}else if(x<pe+pb){pts+=3;to-=1}else if(x<pe+pb+pbo){pts-=1;to+=1}else if(x<pe+pb+pbo+pd){pts-=3;to+=2}else pts+=.5}
  return memo[k]={pts,to};
}
const isReal=L=>!!(EVENTS[L.event]&&EVENTS[L.event].real);
function score(i,L,r){
  if(isReal(L)){const ev=EVENTS[L.event],d=ev.res[i];if(!d)return{pts:0,to:0,none:1};const s=d[r];return{pts:12+3*(ev.par-s),to:s-ev.par,s}}
  return sim(i,L.seed,r);
}

/* ---------- storage: shared db with in-memory fallback ---------- */
function localDb(){
  const m=new Map(),subs=[];const note=()=>subs.forEach(f=>f());
  const snap=(id,v)=>({id,exists:v!==undefined,data:()=>v});
  const doc=path=>({id:path.split("/").pop(),path,
    get:async()=>snap(path.split("/").pop(),m.get(path)),
    set:async d=>{m.set(path,{...d});note()},update:async d=>{m.set(path,{...m.get(path),...d});note()},
    onSnapshot(cb){const f=()=>cb(snap(path.split("/").pop(),m.get(path)));subs.push(f);f();return()=>{}}});
  const collection=path=>({doc:id=>doc(path+"/"+id),onSnapshot(cb){const f=()=>{const docs=[...m].filter(([k])=>k.startsWith(path+"/")&&k.split("/").length===path.split("/").length+1).map(([k,v])=>snap(k.split("/").pop(),v));cb({docs})};subs.push(f);f();return()=>{}}});
  return{doc,collection};
}

  shared=!!db;if(!db)db=localDb();
  try{uid=user&&await user.id()}catch(e){}
  if(!uid){try{uid=localStorage.getItem("ffuid")||("u"+Math.random().toString(36).slice(2,9));localStorage.setItem("ffuid",uid)}catch(e){uid="u"+Math.random().toString(36).slice(2,9)}}
  let c=null;try{c=localStorage.getItem("ffleague")}catch(e){}
  if(c&&shared)openLeague(c);else render();
}
function openLeague(code){
  S.unsub.forEach(f=>f());S.unsub=[];S.code=code;S.league=null;S.teams={};
  S.unsub.push(db.doc("leagues/"+code).onSnapshot(s=>{S.league=s.exists?s.data():null;render()},()=>{}));
  S.unsub.push(db.collection("leagues/"+code+"/teams").onSnapshot(async q=>{
    S.teams={};q.docs.forEach(d=>S.teams[d.id]=d.data());
    try{if(user){const ids=Object.keys(S.teams),ps=await user.profiles(ids);ids.forEach(i=>S.names[i]=(ps[i]&&ps[i].name)||"")}}catch(e){}
    render()},()=>{}));
  try{localStorage.setItem("ffleague",code)}catch(e){}
}
const mk=()=>{const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789";let c="";for(let i=0;i<5;i++)c+=a[Math.floor(Math.random()*a.length)];return c};
async function createLeague(){
  const name=$("#ln").value.trim()||"Sunday League",team=$("#tn").value.trim()||"My Team",event=$("#ev").value;
  try{const code=mk();await db.doc("leagues/"+code).set({name,event,seed:Math.floor(Math.random()*1e6)+1,round:0,host:uid});
    await db.doc(`leagues/${code}/teams/${uid}`).set({uid,team,picks:[]});S.tab=0;openLeague(code)}catch(e){S.err="Couldn't create the league. Try again.";render()}
}
async function joinLeague(){
  const code=$("#jc").value.trim().toUpperCase(),team=$("#jt").value.trim()||"My Team";
  try{const s=await db.doc("leagues/"+code).get();
    if(!s.exists){S.err="No league has that code. Check it and try again.";return render()}
    const t=await db.doc(`leagues/${code}/teams/${uid}`).get();
    if(!t.exists){if(s.data().round>0){S.err="That league has already locked its lineups.";return render()}await db.doc(`leagues/${code}/teams/${uid}`).set({uid,team,picks:[]})}
    S.err="";S.tab=0;openLeague(code)}catch(e){S.err="Couldn't join. Open the shared link first, then enter the code.";render()}
}
const me=()=>S.teams[uid]||{picks:[],team:"My Team"};
const spent=p=>p.reduce((a,i)=>a+PL[i].salary,0);
const savePicks=p=>{S.teams[uid]={...me(),picks:p};render();db.doc(`leagues/${S.code}/teams/${uid}`).update({picks:p}).catch(()=>{})};
function togglePick(id){
  const p=[...me().picks],k=p.indexOf(id);
  if(k>=0)p.splice(k,1);else if(p.length<SIZE&&spent(p)+PL[id].salary<=CAP)p.push(id);else return;
  savePicks(p);
}
function autoDraft(){
  const pool=[...PL.keys()].filter(i=>!isReal(S.league)||EVENTS[S.league.event].res[i]);
  for(let n=0;n<600;n++){const ids=pool.sort(()=>Math.random()-.5).slice(0,SIZE),c=spent(ids);if(c<=CAP&&c>CAP-6000){savePicks(ids);return}}
}
const advance=()=>db.doc("leagues/"+S.code).update({round:S.league.round+1}).catch(()=>{});
function leave(){S.unsub.forEach(f=>f());S.unsub=[];S.code=null;S.league=null;try{localStorage.removeItem("ffleague")}catch(e){}render()}
function standings(){
  const L=S.league;
  return Object.values(S.teams).map(t=>{
    const rr=[];for(let r=0;r<L.round;r++)rr.push(t.picks.map(i=>score(i,L,r).pts).sort((a,b)=>b-a).slice(0,TOP).reduce((a,b)=>a+b,0));
    return{...t,rr,tot:rr.reduce((a,b)=>a+b,0)}}).sort((a,b)=>b.tot-a.tot);
}
const owner=t=>t.uid===uid?"you":(S.names[t.uid]||"friend");
const T=(h,r,cls)=>`<div class="scroll"><table class="tbl"><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

/* ---------- views ---------- */
function lobby(){
  return`<p style="font-size:17px;max-width:560px;margin:18px 0 0">Draft six golfers under a $50,000 cap. Your league is scored on how those golfers actually played.</p>
  <div class="cols"><div><h2>Start a league</h2><label for="ln">League name</label><input id="ln" maxlength="30" placeholder="Sunday Skins"><label for="tn">Your team name</label><input id="tn" maxlength="24" placeholder="Birdie Brigade"><label for="ev">Scored on</label><select id="ev"><option value="bay">Baycurrent Classic, real results</option><option value="sim">Practice rounds, simulated</option></select><div class="acts"><button class="btn" id="create">Create league</button></div></div>
  <div><h2>Join a league</h2><label for="jc">League code</label><input id="jc" maxlength="5" placeholder="K7X2M" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.15em"><label for="jt">Your team name</label><input id="jt" maxlength="24" placeholder="Mulligan Club"><div class="acts"><button class="btn alt" id="join">Join league</button></div></div></div>
  <div class="err" role="alert">${esc(S.err)}</div>
  ${shared?"":`<p class="note">Friends can only join once this page is opened from a shared claude.ai link. Until then you can try a practice league alone.</p>`}
  <div class="acts"><button class="btn alt" id="opentour">Pro golf news and standings</button></div>`;
}
function draft(){
  const L=S.league,t=me(),used=spent(t.picks),left=CAP-used,locked=L.round>0,real=isReal(L),ev=EVENTS[L.event]||EVENTS.sim;
  const slots=Array.from({length:SIZE},(_,k)=>{const id=t.picks[k];return id==null?`<div class="slot open">Open spot</div>`:`<div class="slot"><span><b>${PL[id].name}</b> <span class="mute">${PL[id].tag}</span></span><span>${money(PL[id].salary)} <button class="btn alt sm" data-pick="${id}" ${locked?"disabled":""}>Drop</button></span></div>`}).join("");
  let pool=[...PL].sort((a,b)=>b.salary-a.salary);
  const loaded=real?Object.keys(ev.res).length:0;
  if(real&&S.onlyReal)pool=pool.filter(p=>ev.res[p.id]);
  const rows=pool.map(p=>{const sel=t.picks.includes(p.id),can=sel||(t.picks.length<SIZE&&p.salary<=left),d=real&&ev.res[p.id];
    const res=real?(d?`<td>${tp(d.reduce((a,b)=>a+b,0)-ev.par*4)}</td>`:`<td class="mute">no data</td>`):"";
    return`<tr><td><b>${p.name}</b></td><td class="mute l">${p.tag}</td>${res}<td>${money(p.salary)}</td><td><button class="btn sm ${sel?"alt":""}" data-pick="${p.id}" ${(!can||locked)?"disabled":""}>${sel?"Drop":"Add"}</button></td></tr>`}).join("");
  return`<h2>Your lineup</h2><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px"><div><div class="mute">Salary left</div><div class="salary ${left<0?"u":""}">${money(left)}</div></div><div class="mute" style="text-align:right">${esc(t.team)}<br>${t.picks.length} of ${SIZE} golfers</div></div><div class="bar"><i style="width:${Math.min(100,used/CAP*100)}%"></i></div>${slots}
  <div class="acts"><button class="btn alt sm" id="auto" ${locked?"disabled":""}>Auto-draft</button><button class="btn alt sm" id="clear" ${locked?"disabled":""}>Clear lineup</button></div>${locked?`<p class="mute">Lineups are locked for this league.</p>`:""}
  <details><summary>How scoring works</summary><p class="mute">${real?`Your golfers' actual round scores from the ${ev.name} (par ${ev.par}) are converted to points: 12 for a par round, plus 3 for every stroke under par and minus 3 for every stroke over. A golfer with no result loaded counts as 0. Each round your best four golfers count.`:`Practice mode simulates each hole: eagle +8, birdie +3, par +0.5, bogey −1, double or worse −3. Each round your best four golfers count.`}</p></details>
  <h2>Golfer pool</h2>${real?`<p class="mute" style="margin:0">Real round scores are loaded for ${loaded} of the 50 golfers in this event. The others show no data and would score 0.</p><label class="chk"><input type="checkbox" id="onlyreal" ${S.onlyReal?"checked":""}> Show only golfers with real scores</label>`:""}
  <div class="scroll"><table class="tbl"><thead><tr><th>Golfer</th><th class="l">Tier</th>${real?"<th>Result</th>":""}<th>Salary</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function scores(){
  const L=S.league,real=isReal(L),ev=EVENTS[L.event]||EVENTS.sim;
  if(L.round===0)return`<h2>Leaderboard</h2><p class="mute">Nothing to score yet. The host locks lineups and reveals round 1 from the League tab.</p>`;
  const st=standings(),heads=Array.from({length:L.round},(_,k)=>`<th>R${k+1}</th>`).join(""),done=L.round>=ROUNDS;
  const rows=st.map((t,k)=>`<tr class="${t.uid===uid?"me":""}"><td>${k+1}. ${esc(t.team)} <span class="mute">${esc(owner(t))}</span></td>${t.rr.map(v=>`<td>${v.toFixed(0)}</td>`).join("")}<td><b>${t.tot.toFixed(0)}</b></td></tr>`).join("");
  const mine=me().picks,cut=Array.from({length:L.round},(_,r)=>mine.map(i=>score(i,L,r).pts).sort((a,b)=>b-a)[TOP-1]);
  const g=mine.map(i=>{const r=Array.from({length:L.round},(_,k)=>score(i,L,k));return{i,r,tot:r.reduce((a,x)=>a+x.pts,0),to:r.reduce((a,x)=>a+x.to,0),none:r[0].none}}).sort((a,b)=>b.tot-a.tot);
  const mrows=g.map(x=>`<tr><td>${PL[x.i].name}</td>${x.r.map((s,k)=>`<td class="${s.pts>=cut[k]?"":"dim"}">${s.none?"–":s.pts.toFixed(0)}</td>`).join("")}<td>${x.none?"–":tpc(x.to)}</td><td><b>${x.tot.toFixed(0)}</b></td></tr>`).join("");
  const w=st[0];
  return`<h2>Leaderboard</h2><p class="mute" style="margin:0">${real?`${ev.name}, ${ev.where}. Real scores, ${done?"all four rounds":"through round "+L.round}.`:"Practice rounds, simulated."}</p>
  ${done&&w?`<p class="note"><b>${esc(w.team)}</b> (${esc(owner(w))}) wins the league with ${w.tot.toFixed(0)} points.</p>`:""}
  <div class="board">${T(["Team",...Array.from({length:L.round},(_,k)=>"R"+(k+1)),"Total"],st.map((t,k)=>[`${k+1}. ${esc(t.team)} <span class="mute">${esc(owner(t))}</span>`,...t.rr.map(v=>v.toFixed(0)),`<b>${t.tot.toFixed(0)}</b>`]))}</div>
  ${mine.length?`<h2>Your golfers</h2><div class="scroll"><table class="tbl"><thead><tr><th>Golfer</th>${heads}<th>To par</th><th>Pts</th></tr></thead><tbody>${mrows}</tbody></table></div><p class="mute">Faded points are the two lowest each round and don't count.${real?" A dash means no real result is loaded for that golfer.":""}</p>`:""}`;
}
function league(){
  const L=S.league,isHost=L.host===uid,ts=Object.values(S.teams),done=L.round>=ROUNDS,real=isReal(L);
  const mem=ts.map(t=>[`<b>${esc(t.team)}</b> <span class="mute">${esc(owner(t))}${t.uid===L.host?", host":""}</span>`,`${t.picks.length} of ${SIZE}`]);
  return`<h2>Invite friends</h2><p class="mute">Share this page from the claude.ai share menu with Contributor access, then send friends this code.</p><div style="display:flex;align-items:center;gap:14px"><span class="salary" style="letter-spacing:.14em">${S.code}</span><button class="btn alt sm" data-copy="${S.code}">Copy code</button><span class="mute" id="cp"></span></div>
  <h2>Teams</h2>${T(["Team","Drafted"],mem)}
  <h2>Tournament</h2>${isHost?`<p class="mute">${L.round===0?"When everyone has drafted, lock lineups and reveal the first round.":done?"All four rounds are in.":`Round ${L.round} is showing.`}</p><div class="acts"><button class="btn" id="adv" ${done?"disabled":""}>${L.round===0?(real?"Lock lineups and reveal round 1":"Lock lineups and play round 1"):done?"Tournament complete":(real?"Reveal round ":"Play round ")+(L.round+1)}</button></div>`:`<p class="mute">Only the host starts each round. ${L.round===0?"Waiting for lineups to lock.":`Round ${L.round} of ${ROUNDS} is showing.`}</p>`}
  <div class="acts"><button class="btn alt sm" id="leave">Leave this league</button></div>`;
}
const TOUR_ASOF="Oct 16, 2026";
function tour(){
  const rk=[[1,"Scottie Scheffler","USA"],[2,"Rory McIlroy","NIR"],[3,"Matt Fitzpatrick","ENG"],[4,"Cameron Young","USA"],[5,"Wyndham Clark","USA"],[6,"Russell Henley","USA"],[7,"Tommy Fleetwood","ENG"],[8,"Chris Gotterup","USA"],[9,"Sam Burns","USA"],[10,"Xander Schauffele","USA"]];
  const news=[["Brennan wins in Japan.","The 24-year-old American shot 68 at Yokohama Country Club to take the Baycurrent Classic by a stroke for his third PGA Tour title."],["Schauffele fades late.","The defending champion was in the mix until a double bogey on the last hole left him three back."],["Bridgeman comes up short.","He was chasing back-to-back wins after taking the Biltmore Championship in September."],["Smotherman cruises in Utah.","Austin Smotherman won the Bank of Utah Championship at 26 under the week before."],["Gotterup's big year.","Chris Gotterup has three wins this season, including the John Deere Classic."],["2026 majors so far.","Rory McIlroy won the Masters, Aaron Rai took the PGA Championship at Aronimink, and Wyndham Clark is the U.S. Open champion."]];
  return`<p class="note">Snapshot as of ${TOUR_ASOF}. This page can't pull live feeds, so scores are frozen at that date. Ask Claude to refresh it.</p>
  <h2>Live this week</h2><p style="margin:8px 0 2px"><b>DP World India Championship</b> <span class="mute">Delhi, Oct 15 to 18</span></p><p class="mute" style="margin:0">Round 1 stopped for a five-hour lightning delay, so this is a partial board.</p>${T(["Pos","Player","Score"],[["Lead","Niklas Nørgaard",tpc(-6)],["2","Eugenio Chacarra",tpc(-5)],["–","Rory McIlroy",tpc(-2)]])}
  <p style="margin:18px 0 2px"><b>PGA Tour Americas Tour Championship</b> <span class="mute">Dominican Republic, Oct 15 to 18, after round 1</span></p>${T(["Pos","Player","Score"],[["1","Jake Sollon",tpc(-8)],["2","Luis Gagne",tpc(-7)],["3","Thomas Longbella",tpc(-5)]])}
  <h2>Latest PGA Tour result</h2><p class="mute" style="margin:0">Baycurrent Classic, Yokohama, Oct 8 to 11 (final)</p><div class="board">${T(["Pos","Player","To par","Total"],[["1","Michael Brennan",tpc(-16),"268"],["T2","Keith Mitchell",tpc(-15),"269"],["T2","Jacob Bridgeman",tpc(-15),"269"],["T4","Xander Schauffele",tpc(-13),"271"],["T4","Brian Harman",tpc(-13),"271"],["T9","Min Woo Lee",tpc(-12),"272"],["T9","Sungjae Im",tpc(-12),"272"],["T13","Jordan Spieth",tpc(-11),"273"],["T13","Max Homa",tpc(-11),"273"],["T13","Adam Scott",tpc(-11),"273"],["T23","Justin Thomas",tpc(-8),"276"]])}</div>
  <h2>World ranking, top 10</h2>${T(["Rank","Player","Country"],rk)}<p class="mute">Ranks 3 to 10 are as of Oct 4, 2026. Ranks 1 and 2 come from earlier reports and weren't re-confirmed for that date.</p>
  <h2>News around the game</h2><div class="news">${news.map(n=>`<p><b>${n[0]}</b> ${n[1]}</p>`).join("")}</div>
  <h2>Up next</h2>${T(["Date","Event"],[["Nov 15","Austin Championship, Texas (FedExCup Fall)"],["Nov 15","Charles Schwab Cup Championship, Arizona"],["Nov 22","Scheduled end of the 2026 PGA Tour season"]])}`;
}
function render(){
  const a=$("#app"),mast=`<header class="mast"><div style="display:flex;gap:14px;align-items:center">${ICON}<div><div class="word">The Fairway</div><div class="tag">Fantasy golf, scored on real results</div></div></div></header>${BANNER}`;
  if(!S.code){a.innerHTML=mast+(S.tourOnly?`<div class="acts"><button class="btn alt sm" id="closetour">Back to leagues</button></div>`+tour():lobby());return}
  if(!S.league){a.innerHTML=mast+`<p class="mute" style="margin-top:20px">Loading league…</p>`;return}
  const L=S.league,ev=EVENTS[L.event]||EVENTS.sim,st=L.round===0?"Draft open":L.round>=ROUNDS?"Final":`Round ${L.round} of ${ROUNDS}`;
  a.innerHTML=mast+`<div class="dateline"><span><b>${esc(L.name)}</b></span><span>Code ${S.code}</span><span>${ev.name}${ev.dates?", "+ev.dates:""}</span><span>${st}</span></div>
  <div class="tabs" role="tablist">${["Draft","Scores","League","Tour"].map((n,i)=>`<button role="tab" data-tab="${i}" aria-selected="${S.tab===i}">${n}</button>`).join("")}</div>${[draft,scores,league,tour][S.tab]()}`;
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.tab!=null){S.tab=+t.dataset.tab;return render()}
  if(t.dataset.pick!=null)return togglePick(+t.dataset.pick);
  if(t.dataset.copy){try{navigator.clipboard.writeText(t.dataset.copy)}catch(x){}const c=$("#cp");if(c)c.textContent="Copied";return}
  ({opentour:()=>{S.tourOnly=true;render()},closetour:()=>{S.tourOnly=false;render()},create:createLeague,join:joinLeague,auto:autoDraft,adv:advance,leave:leave,clear:()=>savePicks([])})[t.id]?.();
});
document.addEventListener("change",e=>{if(e.target.id==="onlyreal"){S.onlyReal=e.target.checked;render()}});
boot();
</script>
</body>
</html>
